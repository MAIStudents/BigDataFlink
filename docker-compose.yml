services:
  postgres:
    image: postgres:17
    container_name: bigdataflink_postgres
    environment:
      POSTGRES_DB: bigdataflink
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bigdataflink"]
      interval: 5s
      timeout: 5s
      retries: 12

  kafka:
    image: apache/kafka:3.9.0
    container_name: bigdataflink_kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 5s
      timeout: 10s
      retries: 24

  jobmanager:
    build: .
    container_name: bigdataflink_jobmanager
    command: jobmanager
    environment:
      JOB_MANAGER_RPC_ADDRESS: jobmanager
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8081'"]
      interval: 5s
      timeout: 5s
      retries: 24

  taskmanager:
    build: .
    container_name: bigdataflink_taskmanager
    command: taskmanager
    environment:
      JOB_MANAGER_RPC_ADDRESS: jobmanager
    depends_on:
      jobmanager:
        condition: service_healthy

  submitter:
    build: .
    container_name: bigdataflink_submitter
    entrypoint: ["/bin/bash", "-c"]
    command:
      - "until bash -c 'echo > /dev/tcp/jobmanager/8081' 2>/dev/null; do sleep 2; done; sleep 15; /opt/flink/bin/flink run -d -m jobmanager:8081 -py /opt/jobs/mock_to_star.py"
    environment:
      JOB_MANAGER_RPC_ADDRESS: jobmanager
    volumes:
      - ./jobs:/opt/jobs:ro
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      jobmanager:
        condition: service_healthy
      taskmanager:
        condition: service_started
    restart: "no"

  producer:
    build: ./producer
    container_name: bigdataflink_producer
    volumes:
      - ./исходные данные:/data:ro
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"

volumes:
  postgres_data:
